<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ink tile. The previous favicon was stroke-only with no background, so it
       vanished against a light browser tab. A filled tile guarantees the mark
       reads in light and dark chrome alike. -->
  <rect width="64" height="64" rx="14" fill="#0B1017"/>
  <g fill="none" stroke="#D64545" stroke-linecap="round" stroke-linejoin="round">
    <!-- meridian ring -->
    <circle cx="32" cy="32" r="18" stroke-width="3.5"/>
    <!-- equator ring -->
    <ellipse cx="32" cy="32" rx="18" ry="6" stroke-width="3" transform="rotate(-20 32 32)"/>
    <!-- polar axis / arrow shaft -->
    <path d="M23.6 55.1 L40.4 8.9" stroke-width="3.5"/>
    <!-- arrowhead -->
    <path d="M34.7 13.6 L40.4 8.9 L41.7 16.1" stroke-width="3"/>
    <!-- fletching -->
    <path d="M20.6 52.6 L25.6 49.7 L27.5 55.1" stroke-width="2.5"/>
  </g>
</svg>
